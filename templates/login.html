{% extends "base.html" %}
{% block title %}Login | Ganesh Real Estate{% endblock %}
{% block content %}
<div class="form-wrap">
  <span class="eyebrow">WELCOME BACK</span><h1>Sign in to your account</h1>
  <form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email address</label><input type="email" name="email" required autocomplete="email">
    <label>Password</label><input type="password" name="password" required autocomplete="current-password">
    <button class="full" type="submit">Sign in</button>
  </form>
  <p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
